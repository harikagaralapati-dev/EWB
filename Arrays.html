
<!DOCTYPE html>
<html>
<head>
    <title>Assignment 6 - Arrays and Objects</title>
</head>
<body>
    <h2>Arrays, Objects, and Core Methods</h2>

    <script>
        // Create an array of product objects
        const products = [
            { name: "Laptop", price: 800 },
            { name: "Mouse", price: 25 },
            { name: "Keyboard", price: 45 }
        ];

        // 1. forEach() - Print all products
        console.log("-- All Products (forEach) --");

        products.forEach(product => {
            console.log(
                `Item: ${product.name} - Price: $${product.price}`
            );
        });

        // 2. filter() - Find products under $50
        const filteredProducts = products.filter(
            product => product.price < 50
        );

        console.log("-- Filtered Products (Price < $50) --");
        console.log(filteredProducts);

        // 3. map() - Create formatted product tags
        const mappedProducts = products.map(
            product =>
                `${product.name.toUpperCase()} costs $${product.price}`
        );

        console.log("-- Mapped Product Tags (map) --");
        console.log(mappedProducts);
    </script>
</body>
</html>
