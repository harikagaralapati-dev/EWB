
<!DOCTYPE html>
<html>
<head>
    <title>Product Inventory Dashboard</title>
</head>
<body>
    <h2>Interactive Product Inventory & Analytics Dashboard</h2>
    <p>Open the browser Console (F12) to view the results.</p>

    <script>
        console.log("--- Initializing Inventory System ---");

        // 1. Initial inventory
        const inventory = [
            { name: "Laptop", price: 800 },
            { name: "Mouse", price: 25 }
        ];

        // 2. Get product details from the user
        let productName = prompt("Enter new product name:");
        let productPrice = Number(prompt("Enter product price:"));

        // Validate the input
        if (
            productName === null ||
            productName.trim() === "" ||
            !Number.isFinite(productPrice) ||
            productPrice <= 0
        ) {
            console.log("Invalid product details. Please try again.");
        } else {
            productName = productName.trim();

            inventory.push({
                name: productName,
                price: productPrice
            });

            console.log(
                `[Prompt executed: User adds "${productName}" at "$${productPrice}"]`
            );
        }

        // 3. Assign category using if...else and switch
        function getCategory(price) {
            let category;

            if (price < 50) {
                category = "Budget";
            } else if (price >= 200) {
                category = "Premium";
            } else {
                category = "Standard";
            }

            switch (category) {
                case "Budget":
                    return "Budget";
                case "Standard":
                    return "Standard";
                case "Premium":
                    return "Premium";
                default:
                    return "Unknown";
            }
        }

        // 4. Display inventory using forEach()
        console.log("--- Processing Inventory Roster (forEach) ---");

        inventory.forEach(product => {
            console.log(
                `* Item: ${product.name} ($${product.price}) -> Category: ${getCategory(product.price)}`
            );
        });

        // 5. Calculate total inventory value
        function calculateTotal(items) {
            let total = 0;

            for (let i = 0; i < items.length; i++) {
                if (items[i].price <= 0) {
                    continue;
                }

                total += items[i].price;
            }

            return total;
        }

        // Arrow function with default tax rate
        const calculateWithTax = (amount, taxRate = 0.1) =>
            amount * (1 + taxRate);

        // 6. Financial analytics
        console.log("--- Financial Analytics ---");

        const totalValue = calculateTotal(inventory);
        console.log("Total Inventory Value: $" + totalValue);

        // Search for the first product costing under $200
        let firstAffordable = null;

        for (const product of inventory) {
            if (product.price >= 200) {
                continue;
            }

            firstAffordable = product;
            break;
        }

        // Filter all affordable products
        const affordableItems = inventory.filter(
            product => product.price < 200
        );

        console.log(
            'Filtered Affordable Items (Under $200): ' +
            JSON.stringify(affordableItems.map(product => product.name))
        );

        // Map products to a formatted report
        const report = inventory.map(
            product =>
                `${product.name.toUpperCase()}: $${product.price}`
        );

        console.log(
            "Formatted Report List: " + JSON.stringify(report)
        );

        // Example tax calculation (10%)
        console.log(
            "Total Value Including 10% Tax: $" +
            calculateWithTax(totalValue).toFixed(2)
        );
    </script>
</body>
</html>
