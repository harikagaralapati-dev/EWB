
<!DOCTYPE html>
<html>
<head>
    <title>Assignment 3</title>
</head>
<body>
    <h2>Test Score Evaluation</h2>

    <script>
        let score = Number(prompt("Enter your test score:"));

        // Determine letter grade using if...else
        let grade;

        if (score >= 90) {
            grade = "A";
        } else if (score >= 80) {
            grade = "B";
        } else if (score >= 70) {
            grade = "C";
        } else if (score >= 60) {
            grade = "D";
        } else {
            grade = "F";
        }

        // Use switch statement
        switch (grade) {
            case "A":
                grade = "A";
                break;
            case "B":
                grade = "B";
                break;
            case "C":
                grade = "C";
                break;
            case "D":
                grade = "D";
                break;
            default:
                grade = "F";
        }

        // Use ternary operator
        let status = score >= 40 ? "Passed" : "Failed";

        console.log("Score: " + score);
        console.log("Grade: " + grade);
        console.log("Status: " + status);
    </script>
</body>
</html>
