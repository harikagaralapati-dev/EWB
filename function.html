
<!DOCTYPE html>
<html>
<head>
    <title>Assignment 5 - Functions and Scope</title>
</head>
<body>
    <h2>Function Architecture and Scope</h2>

    <script>
        // 1. Standard function with default parameters
        function rectangleArea(length = 5, width = 4) {
            return length * width;
        }

        console.log(
            "Standard Function Area (Default 5x4): " +
            rectangleArea()
        );

        // 2. Arrow function with parameters
        const arrowArea = (length = 5, width = 4) => length * width;

        console.log(
            "Arrow Function Area (Custom 10x3): " +
            arrowArea(10, 3)
        );

        // 3. Demonstrate block scope
        {
            let blockVar = 100;
        }

        try {
            console.log(blockVar);
        } catch (error) {
            console.log(
                "Scope Test Error: " +
                error.name + ": " + error.message
            );
        }
    </script>
</body>
</html>
