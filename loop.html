
<!DOCTYPE html>
<html>
<head>
    <title>Assignment 4 - Loops</title>
</head>
<body>
    <h2>Loop Control Structures</h2>

    <script>
        // 1. For loop: Multiplication table of 5
        console.log("-- Multiplication Table of 5 --");

        for (let i = 1; i <= 5; i++) {
            console.log(`5 x ${i} = ${5 * i}`);
        }

        // 2. While loop with break
        console.log("-- First number > 10 divisible by 6 --");

        let num = 11;

        while (num > 10) {
            if (num % 6 === 0) {
                console.log("Found: " + num);
                break;
            }
            num++;
        }

        // 3. Do...while loop with continue
        console.log("-- Do...while loop with continue --");

        let n = 0;

        do {
            n++;

            if (n === 3) {
                continue;
            }

            console.log("Number: " + n);
        } while (n < 5);
    </script>
</body>
</html>
